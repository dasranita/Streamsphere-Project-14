services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo_local
      POSTGRES_DB: streamsphere
    volumes:
      - data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d streamsphere]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:demo_local@db:5432/streamsphere
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:4000:4000']
  web:
    build: ./web
    ports: ['127.0.0.1:3000:3000']
  engine:
    build: ./engine
    ports: ['127.0.0.1:8000:8000']
volumes:
  data:
